name: Terraform

on:

  push:

    branches:

      - main

  pull_request:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format

        run: terraform fmt -check -recursive

      - name: Terraform Init

        run: terraform init

      - name: Terraform Validate

        run: terraform validate
